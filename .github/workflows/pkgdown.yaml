name: Build pkgdown site

on:
  push:
    branches:
      - dev  # Trigger on push to the dev branch (for any push to dev, including commit, merge, etc.)

jobs:
  build:
    runs-on: ubuntu-latest  # Use an Ubuntu runner

    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.0'  # Specify your R version (you can adjust this version as needed)

      - name: Install dependencies
        run: |
          install.packages("pkgdown")
          remotes::install_deps()  # Install any additional dependencies your package needs

      - name: Build pkgdown site
        run: |
          library(pkgdown)
          pkgdown::build_site_github_pages()

      - name: Deploy pkgdown site to dev branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_dir: ./docs  # Directory where the site is built (it will be in 'docs' by default)
          publish_branch: dev  # Deploy to the dev branch
