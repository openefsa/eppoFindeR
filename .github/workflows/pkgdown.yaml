name: Build pkgdown site

on:
  push:
    branches:
      - dev  # Trigger on push to the dev branch (commit, merge, etc.)

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy pkgdown site to dev branch
        uses: JamesIves/github-pages-deploy-action@v4.4.1
        with:
          clean: false
          branch: gh-pages
          folder: docs

      # Optional: Trigger a GitHub Pages refresh (source is set to the gh-pages branch, /root folder)
      - name: Trigger GitHub Pages refresh
        run: |
          git fetch origin gh-pages
          git checkout gh-pages
          git pull origin gh-pages
          git add -A
          git commit -m "Trigger GitHub Pages update"
          git push origin gh-pages
