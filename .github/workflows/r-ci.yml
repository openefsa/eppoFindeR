name: CI with Coverage for R Package

on:
  push:
    branches:
      - dev  # Trigger the workflow on push to the dev branch
  pull_request:
    branches:
      - dev  # Trigger the workflow on pull requests to the dev branch

jobs:
  test:
    name: Run tests and collect coverage
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0  # Fetch all history to ensure proper coverage data

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install dependencies
        run: |
          sudo apt-get install libcurl4-openssl-dev libssl-dev libxml2-dev  # System dependencies for R packages
          R -e "install.packages('devtools')"  # Install devtools for development tools
          R -e "devtools::install_deps()"  # Install project dependencies

      - name: Set up environment variables (if necessary)
        run: echo "EPPO_token=${{ secrets.EPPO_TOKEN }}" >> $GITHUB_ENV  # Set EPPO token if necessary

      - name: Run tests with `testthat`
        run: |
          R -e "devtools::test()"  # Run tests using testthat (installed via devtools)

      - name: Generate coverage report with `covr`
        run: |
          R -e "covr::package_coverage()"  # Generate the coverage report
          R -e "covr::coveralls()"  # Upload the coverage data to Coveralls (for testing, you can replace with Codecov later)

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}  # Use the Codecov token stored in GitHub secrets
          file: coverage.xml  # Path to coverage.xml generated by covr (you may need to configure this if it's not automatically generated)
